    <script>
      (function () {
        const FID = "06-pedido";
        const q = (id) => document.getElementById(FID + "-" + id);
        const HEART = '<svg viewBox="0 0 24 24"><path fill="#FF6A1A" d="M12 21.2s-7.6-4.7-10.1-9.4C.2 8.5 1.9 4.6 5.5 4.1 8 3.8 9.7 5.1 12 7.5c2.3-2.4 4-3.7 6.5-3.4 3.6.5 5.3 4.4 3.6 7.7C19.6 16.5 12 21.2 12 21.2z"/></svg>';

        // deterministic mini hearts (x, y center in canvas px, size, rise dx, delay)
        const MINIS = [
          [420, 760, 54, -60, 0.00],
          [520, 790, 40, 50, 0.04],
          [380, 700, 34, -90, 0.08],
          [575, 720, 58, 85, 0.03],
          [470, 820, 30, -20, 0.10],
          [610, 790, 36, 40, 0.12],
          [350, 800, 44, -40, 0.06],
        ];
        const minisWrap = q("minis");
        MINIS.forEach((m, i) => {
          const el = document.createElement("div");
          el.className = FID + "-heart";
          el.id = FID + "-mini" + i;
          el.style.left = m[0] - m[2] / 2 + "px";
          el.style.top = m[1] - m[2] / 2 + "px";
          el.style.width = m[2] + "px";
          el.style.height = m[2] + "px";
          el.innerHTML = HEART;
          minisWrap.appendChild(el);
        });

        const tl = gsap.timeline({ paused: true });

        // ---------- base states ----------
        tl.set(q("shot2"), { yPercent: 100 }, 0);
        tl.set(q("shot3"), { yPercent: 100 }, 0);
        tl.set([q("spot"), q("burst")], { opacity: 0 }, 0);
        tl.set(q("cta"), { opacity: 0 }, 0);
        tl.set(q("chip"), { opacity: 0 }, 0);
        tl.set([q("w2"), q("w3")], { yPercent: 110, opacity: 0 }, 0);

        // ---------- macro camera: slow push underneath ----------
        tl.fromTo(q("camera"), { scale: 1 }, { scale: 1.035, duration: 4.133, ease: "sine.inOut" }, 0);

        // ---------- Scene 1 (0.0–0.7): curte ----------
        tl.fromTo(q("w1"), { yPercent: 60, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.05);
        tl.fromTo(q("bar"), { x: 0 }, { x: 0, duration: 0.01 }, 0);
        tl.fromTo(q("s1"), { color: "#B9A08E" }, { color: "#FF6A1A", duration: 0.2, ease: "power2.out" }, 0.3);

        // big heart: smooth pop on "curte", one pulse, then dissolves into the screen
        tl.fromTo(q("bigheart"), { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power3.out" }, 0.3);
        tl.to(q("bigheart"), { scale: 1.12, duration: 0.1, ease: "power1.out" }, 0.54);
        tl.to(q("bigheart"), { scale: 1.3, opacity: 0, duration: 0.22, ease: "power2.in" }, 0.64);

        // small hearts rise in depth (finite, one pass)
        MINIS.forEach((m, i) => {
          tl.fromTo(
            q("mini" + i),
            { opacity: 0, scale: 0.4, x: 0, y: 0, z: 0, transformPerspective: 900 },
            { opacity: 1, scale: 1, x: m[3] * 0.4, y: -90, z: 80, duration: 0.2, ease: "power2.out" },
            0.36 + m[4]
          );
          tl.to(q("mini" + i), { opacity: 0, x: m[3], y: -260 - i * 12, z: 260, duration: 0.45, ease: "power1.in" }, 0.56 + m[4]);
        });

        // ---------- Scene 2 (0.7–1.8): salva os favoritos ----------
        // sheet push-up inside the screen
        tl.to(q("shot1"), { yPercent: -18, opacity: 0.4, duration: 0.45, ease: "power3.inOut" }, 0.68);
        tl.fromTo(q("shot2"), { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "power3.inOut" }, 0.68);
        // word swap out-up / in-up
        tl.to(q("w1"), { yPercent: -110, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.66);
        tl.fromTo(q("w2"), { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.8);
        tl.to(q("bar"), { x: 280, duration: 0.4, ease: "power3.inOut" }, 0.68);
        tl.to(q("s1"), { color: "#B9A08E", duration: 0.2 }, 0.68);
        tl.to(q("s2"), { color: "#FF6A1A", duration: 0.2 }, 0.9);
        // favorites chip floats in, foreground, on "favoritos"
        tl.fromTo(
          q("chip"),
          { opacity: 0, scale: 0.6, x: 40, y: 20, z: 0, transformPerspective: 1000 },
          { opacity: 1, scale: 1, x: 0, y: 0, z: 60, duration: 0.4, ease: "power3.out" },
          1.13
        );
        tl.to(q("chip"), { y: -16, duration: 0.6, ease: "sine.inOut" }, 1.53);

        // ---------- Scene 3 (1.8–4.13): pede direto no WhatsApp ----------
        tl.to(q("shot2"), { yPercent: -18, opacity: 0.4, duration: 0.45, ease: "power3.inOut" }, 1.9);
        tl.fromTo(q("shot3"), { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "power3.inOut" }, 1.9);
        tl.to(q("chip"), { opacity: 0.25, duration: 0.3, ease: "power2.out" }, 1.9);
        tl.to(q("w2"), { yPercent: -110, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.88);
        tl.fromTo(q("w3"), { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.02);
        tl.to(q("bar"), { x: 560, duration: 0.4, ease: "power3.inOut" }, 1.9);
        tl.to(q("s2"), { color: "#B9A08E", duration: 0.2 }, 1.9);
        tl.to(q("s3"), { color: "#FF6A1A", duration: 0.2 }, 2.1);

        // the real button (cropped from the screenshot) sits exactly over its pixels, then LIFTS under a spotlight
        tl.set(q("cta"), { opacity: 1 }, 2.35);
        tl.fromTo(q("spot"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 2.32);
        tl.fromTo(
          q("cta"),
          { scale: 1, y: 0, z: 0, transformPerspective: 1200, boxShadow: "0 4px 8px rgba(0,0,0,0.2)" },
          { scale: 1.24, y: -40, z: 120, boxShadow: "0 50px 90px rgba(0,0,0,0.7)", duration: 0.6, ease: "power3.out" },
          2.36
        );
        tl.fromTo(q("burst"), { opacity: 0, scale: 0.8 }, { opacity: 0.45, scale: 1.2, y: -40, duration: 0.6, ease: "power2.out" }, 2.4);

        // "WhatsApp": soft press-release (linear press, spring release)
        const PRESS_START = 3.12, PRESS_DUR = 0.14;
        const RELEASE_START = PRESS_START + PRESS_DUR;
        tl.to(q("cta"), { scale: 1.24 * 0.93, boxShadow: "0 18px 30px rgba(0,0,0,0.6)", duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
        tl.to(q("cta"), { scale: 1.24, boxShadow: "0 50px 90px rgba(0,0,0,0.7)", duration: 0.55, ease: "back.out(1.6)" }, RELEASE_START);
        tl.to(q("burst"), { opacity: 0.95, scale: 2.0, duration: 0.4, ease: "power2.out" }, RELEASE_START);
        tl.to(q("burst"), { opacity: 0.55, scale: 1.6, duration: 0.45, ease: "power2.inOut" }, RELEASE_START + 0.4);

        window.__timelines = window.__timelines || {};
        window.__timelines["06-pedido"] = tl;
      })();
