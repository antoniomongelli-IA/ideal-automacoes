  </style>

  <div id="root" data-composition-id="05-promo" data-width="1080" data-height="1920" data-start="0" data-duration="4.062">
    <div id="05-promo-bg" class="clip" data-start="0" data-duration="4.062" data-track-index="0"></div>

    <div id="05-promo-stage" class="clip" data-start="0" data-duration="4.062" data-track-index="1">
      <div id="05-promo-kicker"><span class="rule05"></span><span>Promoção automática</span></div>
      <div id="05-promo-head"><span class="w05">happy</span> <span class="w05">hour<span class="q05">?</span></span></div>

      <div id="05-promo-card"><img src="assets/12-painel-promocoes-cel.png" alt="" /></div>

      <div id="05-promo-phone">
        <div id="05-promo-screen">
          <img src="assets/04-promo.png" alt="" />
          <div id="05-promo-banner"></div>
        </div>
      </div>

      <div id="05-promo-clock">
        <div id="05-promo-glow"></div>
        <svg viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">
          <!-- depth disc (3D edge) -->
          <circle cx="220" cy="234" r="178" fill="#B9A08E" />
          <circle cx="220" cy="228" r="178" fill="#D9C4B3" />
          <!-- outer track -->
          <circle cx="220" cy="220" r="205" fill="none" stroke="#3A2A20" stroke-width="14" />
          <!-- face -->
          <circle cx="220" cy="220" r="178" fill="#FFF4EA" />
          <!-- lit wedge 6->8 -->
          <path id="05-promo-wedge" d="M 220 220 L 220 384 A 164 164 0 0 1 77.97 302 Z" fill="#FF6A1A" opacity="0" />
          <g id="05-promo-ticks" stroke="#0F0805" stroke-linecap="round"></g>
          <!-- orange arc 18h -> 20h -->
          <path id="05-promo-arc" d="M 220 425 A 205 205 0 0 1 42.47 322.5" fill="none" stroke="#FF6A1A" stroke-width="16" stroke-linecap="round" />
          <line id="05-promo-hour" x1="220" y1="220" x2="220" y2="124" stroke="#0F0805" stroke-width="16" stroke-linecap="round" transform="rotate(150 220 220)" />
          <line id="05-promo-min" x1="220" y1="220" x2="220" y2="78" stroke="#0F0805" stroke-width="9" stroke-linecap="round" transform="rotate(0 220 220)" />
          <circle cx="220" cy="220" r="14" fill="#FF6A1A" />
          <circle cx="220" cy="220" r="5" fill="#0F0805" />
        </svg>
      </div>
      <div id="05-promo-chip">18H → 20H</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const FID = "05-promo";
      const $ = (s) => document.getElementById(FID + "-" + s);
      const NS = "http://www.w3.org/2000/svg";

      // clock ticks (built at setup, static)
      const ticks = $("ticks");
      for (let i = 0; i < 12; i++) {
        const a = (i * 30 * Math.PI) / 180;
        const major = i % 3 === 0;
        const r1 = major ? 140 : 150;
        const r2 = 162;
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", (220 + r1 * Math.sin(a)).toFixed(2));
        l.setAttribute("y1", (220 - r1 * Math.cos(a)).toFixed(2));
        l.setAttribute("x2", (220 + r2 * Math.sin(a)).toFixed(2));
        l.setAttribute("y2", (220 - r2 * Math.cos(a)).toFixed(2));
        l.setAttribute("stroke-width", major ? "8" : "4");
        ticks.appendChild(l);
      }

      const arc = $("arc");
      const LEN = arc.getTotalLength();
      arc.style.strokeDasharray = String(LEN);
      arc.style.strokeDashoffset = String(LEN);

      const phone = $("phone");
      const clock = $("clock");
      const card = $("card");
      const hour = $("hour");
      const min = $("min");
      const words = document.querySelectorAll('[id="05-promo-head"] .w05');

      const tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–1.0): phone holds center, headline lands on "happy hour"
      tl.fromTo(phone, { scale: 0.97, x: 0, y: 0 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo($("kicker"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.fromTo(words, { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out", stagger: 0.14 }, 0.18);

      // ---------- Scene 2 (1.0–2.4): phone yields right, 3D clock takes the vacated space
      tl.to(phone, { x: 250, y: 40, scale: 0.72, duration: 0.85, ease: "power3.inOut" }, 1.0);
      tl.fromTo(
        clock,
        { opacity: 0, scale: 0.55, rotationY: -75, rotationX: 10, x: -60 },
        { opacity: 1, scale: 1, rotationY: 0, rotationX: 0, x: 0, duration: 0.75, ease: "power3.out" },
        1.12
      );

      // hands sweep 17h -> 18h (svg-icon-enrichment: rotation via transform attribute)
      const hands = { h: 150, m: 0 };
      tl.fromTo(
        hands,
        { h: 150, m: 0 },
        {
          h: 180,
          m: 360,
          duration: 0.85,
          ease: "power2.inOut",
          onUpdate: () => {
            hour.setAttribute("transform", "rotate(" + hands.h.toFixed(3) + " 220 220)");
            min.setAttribute("transform", "rotate(" + hands.m.toFixed(3) + " 220 220)");
          },
        },
        1.35
      );

      // 18h reached: orange 18h–20h arc draws (stat-bars-and-fills ring form), ring lights
      tl.fromTo(arc, { strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.15);
      tl.fromTo($("wedge"), { opacity: 0 }, { opacity: 0.22, duration: 0.4, ease: "power2.out" }, 2.2);
      tl.fromTo($("glow"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 2.25);
      tl.fromTo($("chip"), { opacity: 0, y: 18, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 2.3);
      // promo banner on the phone lights up as the hour hits
      tl.fromTo($("banner"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 2.2);
      tl.to($("banner"), { opacity: 0.75, duration: 0.6, ease: "sine.inOut" }, 2.5);

      // ---------- Scene 3 (2.4–4.06): painel card rises behind the clock in perspective, then holds
      tl.fromTo(
        card,
        { opacity: 0, y: 360, rotationX: 38, rotationY: 14, scale: 0.9, filter: "blur(8px)" },
        { opacity: 1, y: 0, rotationX: 12, rotationY: 8, scale: 1, filter: "blur(1.2px)", duration: 0.85, ease: "power3.out" },
        2.45
      );
      // quiet settle under the hold (no exits)
      tl.to(card, { rotationX: 9, rotationY: 6, filter: "blur(0.8px)", duration: 0.75, ease: "sine.out" }, 3.3);
      tl.to(phone, { y: 30, duration: 1.1, ease: "sine.inOut" }, 2.9);
      tl.set({}, {}, 4.062);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
