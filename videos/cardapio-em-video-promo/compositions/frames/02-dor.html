<template id="02-dor-template">
  <style>
    @font-face {
      font-family: "Anton";
      src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      color: #FFF4EA;
    }

    .dor02-bg {
      position: absolute;
      inset: 0;
      background: #0F0805;
    }

    .dor02-stage {
      position: absolute;
      inset: 0;
      perspective: 1400px;
      perspective-origin: 50% 40%;
    }

    .dor02-cam {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: 50% 45%;
    }

    .dor02-card {
      position: absolute;
      font-family: "Anton", sans-serif;
      font-weight: 400;
      text-transform: lowercase;
      letter-spacing: -0.03em;
      line-height: 0.92;
      white-space: nowrap;
      transform-origin: 0% 50%;
    }

    .dor02-word {
      display: inline-block;
      margin-right: 0.18em;
    }
    .dor02-word:last-child { margin-right: 0; }

    #dor02-card1 {
      left: 60px;
      top: 330px;
      font-size: 138px;
    }

    #dor02-card2 {
      right: 60px;
      top: 640px;
      font-size: 124px;
      text-align: right;
      transform-origin: 100% 50%;
    }

    #dor02-card3 {
      left: 0;
      right: 0;
      top: 1000px;
      text-align: center;
      transform-origin: 50% 50%;
    }
    #dor02-card3 .dor02-l1 {
      display: block;
      font-size: 176px;
    }
    #dor02-card3 .dor02-l2 {
      display: block;
      font-size: 290px;
      line-height: 0.95;
      color: #FF6A1A;
    }

    .dor02-kicker {
      position: absolute;
      left: 60px;
      top: 250px;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #FF6A1A;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .dor02-rule {
      display: inline-block;
      width: 36px;
      height: 2px;
      background: #FF6A1A;
    }

    #dor02-chart {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: visible;
    }
    #dor02-chart path {
      fill: none;
      stroke: #FF6A1A;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    #dor02-line {
      stroke-width: 14;
      opacity: 0.9;
    }
    #dor02-head {
      stroke-width: 14;
    }
  </style>

  <div id="root" data-composition-id="02-dor" data-width="1080" data-height="1920" data-start="0" data-duration="4.533">
    <div class="dor02-bg clip" data-start="0" data-duration="4.533" data-track-index="0"></div>

    <div class="dor02-stage clip" data-start="0" data-duration="4.533" data-track-index="1">
      <div class="dor02-cam" id="dor02-cam">
        <!-- falling chart line: drawn behind the payoff phrase -->
        <svg id="dor02-chart" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <path id="dor02-line" pathLength="1" d="M 70 930 L 330 1090 L 470 1030 L 700 1290 L 820 1240 L 975 1505" />
          <path id="dor02-head" pathLength="1" d="M 900 1500 L 975 1505 L 988 1430" />
        </svg>

        <div class="dor02-kicker" id="dor02-kicker"><span class="dor02-rule"></span>sem foto</div>

        <div class="dor02-card" id="dor02-card1">
          <span class="dor02-word">não</span><span class="dor02-word">vê</span><span class="dor02-word">o</span><span class="dor02-word">prato.</span>
        </div>

        <div class="dor02-card" id="dor02-card2">
          <span class="dor02-word">pede</span><span class="dor02-word">o</span><span class="dor02-word">de</span><span class="dor02-word">sempre.</span>
        </div>

        <div class="dor02-card" id="dor02-card3">
          <span class="dor02-l1"><span class="dor02-word">você</span><span class="dor02-word">vende</span></span>
          <span class="dor02-l2"><span class="dor02-word" id="dor02-menos">menos.</span></span>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelectorAll(s);

      // Chart line: pathLength="1" normalizes the measured length to 1 (dash = full path)
      gsap.set(["#dor02-line", "#dor02-head"], { strokeDasharray: 1, strokeDashoffset: 1 });

      // Macro camera: slow push underneath the whole shot
      tl.fromTo("#dor02-cam", { scale: 1 }, { scale: 1.05, duration: 4.133, ease: "none" }, 0);

      // ---- Scene 1 (0.0–1.3s): "não vê o prato." per-word staggered reveal, rotateY -10°
      tl.fromTo("#dor02-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.05);
      gsap.set("#dor02-card1", { rotationY: -10, z: 0 });
      tl.fromTo(q("#dor02-card1 .dor02-word"),
        { opacity: 0, y: 60, filter: "blur(14px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", stagger: 0.14 },
        0.1);

      // ---- Scene 2 (1.3–2.4s): camera recedes in Z — card1 sinks back with depth blur; card2 arrives in front, right
      tl.to("#dor02-card1", { z: -420, x: -20, opacity: 0.5, filter: "blur(5px)", duration: 0.7, ease: "power3.out" }, 1.3);
      tl.to("#dor02-kicker", { opacity: 0.35, duration: 0.5, ease: "power2.out" }, 1.3);
      tl.fromTo("#dor02-card2",
        { rotationY: 10, z: 260, opacity: 0, filter: "blur(12px)" },
        { rotationY: 8, z: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" },
        1.32);
      tl.fromTo(q("#dor02-card2 .dor02-word"),
        { opacity: 0, x: 50 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.09 },
        1.34);

      // ---- Scene 3 (2.4–4.13s): both sink further; "você vende menos." slams center, "menos" orange
      tl.to("#dor02-card1", { z: -900, opacity: 0.22, filter: "blur(10px)", duration: 0.7, ease: "power3.out" }, 2.4);
      tl.to("#dor02-card2", { z: -480, opacity: 0.45, filter: "blur(6px)", duration: 0.7, ease: "power3.out" }, 2.4);
      tl.to("#dor02-kicker", { opacity: 0.15, duration: 0.5 }, 2.4);

      tl.fromTo(q("#dor02-card3 .dor02-l1 .dor02-word"),
        { opacity: 0, scale: 1.6, filter: "blur(12px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out", stagger: 0.17 },
        2.45);
      tl.fromTo("#dor02-menos",
        { opacity: 0, scale: 1.9, filter: "blur(16px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.6)" },
        2.92);

      // svg-path-draw: falling chart line draws behind the phrase, then holds
      tl.to("#dor02-line", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 2.75);
      tl.to("#dor02-head", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 3.27);

      // settle: tiny pressure on the payoff, then hold
      tl.fromTo("#dor02-card3", { y: 0 }, { y: 8, duration: 0.7, ease: "sine.inOut" }, 3.4);

      window.__timelines["02-dor"] = tl;
    })();
  </script>
</template>
