      const flash = q("f03-encosta-flash");
      const waves = [q("f03-encosta-wave-1"), q("f03-encosta-wave-2"), q("f03-encosta-wave-3")];

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.9s): plaque settles on the table; phone enters from top-right, 3D turn 35°→12°, screen off

      tl.fromTo(kicker, { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.15);
      tl.fromTo(
        phone,
        { x: 460, y: -620, scale: 0.58, rotationY: 35, rotation: 14, opacity: 1, transformOrigin: "50% 50%" },
        { x: 30, y: 120, scale: 0.6, rotationY: 12, rotation: 4, duration: 0.9, ease: "power3.out" },
        0
      );
      tl.fromTo(off, { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo(feed, { yPercent: 100 }, { yPercent: 100, duration: 0.01 }, 0);
      tl.fromTo(splash, { yPercent: 0, scale: 1.08 }, { yPercent: 0, scale: 1.08, duration: 0.01 }, 0);

      // Scene 2 (0.9–1.9s): "encosta" — phone dips to touch the plaque; waves expand; screen lights with splash

      tl.to(phone, { y: 186, duration: 0.22, ease: "power2.out" }, 1.28);
      waves.forEach((w, i) => {
        tl.fromTo(
          w,
          { scale: 0.35, opacity: 0.95 },
          { scale: 2.1, opacity: 0, duration: 0.75, ease: "power2.out" },
          1.26 + i * 0.14
        );
      });
      tl.to(off, { opacity: 0, duration: 0.22, ease: "power1.out" }, 1.32);
      tl.fromTo(flash, { opacity: 0 }, { opacity: 0.55, duration: 0.08, ease: "none" }, 1.32);
      tl.to(flash, { opacity: 0, duration: 0.3, ease: "power2.out" }, 1.4);
      tl.to(splash, { scale: 1, duration: 0.6, ease: "power3.out" }, 1.32);

      // Scene 3 (1.9–2.637s): "mesa" — phone rises and squares to camera; splash pushes up to the feed; hold

      tl.to(splash, { yPercent: -35, duration: 0.42, ease: "power3.inOut" }, 2.0);
      tl.to(feed, { yPercent: 0, duration: 0.42, ease: "power3.inOut" }, 2.0);
