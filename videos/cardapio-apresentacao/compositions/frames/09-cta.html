  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "09-cta";
      var DUR = 6.189;
      var host = document.querySelector('[data-composition-id="09-cta"] .f09-cta-orbit-stage');
      var root = host ? host.closest('[data-composition-id="09-cta"]') : document;
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–1.5s): crown of dish covers flips in (orbit-3d-entry) ----------
      var RADIUS_X = 380;
      var RADIUS_Y = 230; // Y_TO_X ~0.6 — tilted ring
      var DRIFT_DEG = 10; // slow drift over the whole frame (no full revolution)
      var ENTRY_DUR = 0.7;
      var STAGGER = 0.1;

      qa(".f09-cta-orbit-item").forEach(function (item, i) {
        var a0 = (Number(item.dataset.angle) / 360) * Math.PI * 2;
        var tilt = Number(item.dataset.tilt) || 0;
        var card = item.querySelector(".f09-cta-card");

        var place = function (p) {
          var a = a0 + p * (DRIFT_DEG / 360) * Math.PI * 2;
          var x = Math.cos(a) * RADIUS_X;
          var y = Math.sin(a) * RADIUS_Y;
          item.style.zIndex = String(1 + Math.round(((y + RADIUS_Y) / (2 * RADIUS_Y)) * 49));
          item.style.transform =
            "translate(-50%, -50%) translate(" + x.toFixed(2) + "px, " + y.toFixed(2) + "px) rotate(" + tilt + "deg)";
        };
        place(0); // park at orbital position before any tween

        // flip IN PLACE: rotation / z / scale / opacity only
        tl.fromTo(
          card,
          { rotationX: -80, rotationY: 60, z: -320, scale: 0.4, opacity: 0 },
          {
            rotationX: 0,
            rotationY: 0,
            z: 0,
            scale: 1,
            opacity: 0.55,
            duration: ENTRY_DUR,
            ease: "back.out(1.4)",
          },
          0.05 + i * STAGGER
        );

        // slow orbital drift across the whole frame (own progress driver per item)
        var orbit = { p: 0 };
        tl.fromTo(
          orbit,
          { p: 0 },
          {
            p: 1,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              place(orbit.p);
            },
          },
          0
        );
      });

      // ---------- Scene 1: flame draws itself (svg-path-draw), then fills ----------
      var outer = q(".f09-cta-flame-outer");
      var inner = q(".f09-cta-flame-inner");
      [outer, inner].forEach(function (p) {
        var len = 900;
        try {
          len = p.getTotalLength() * 1.05;
        } catch (e) {}
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        p.dataset.len = String(len);
      });
      tl.fromTo(
        outer,
        { strokeDashoffset: Number(outer.dataset.len) },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        0.1
      );
      tl.fromTo(
        inner,
        { strokeDashoffset: Number(inner.dataset.len) },
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        0.1 + 0.6 * 0.75
      );
      tl.fromTo(outer, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.35, ease: "power1.out" }, 0.72);
      tl.fromTo(inner, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.35, ease: "power1.out" }, 0.86);
      tl.fromTo(
        ".f09-cta-flame",
        { scale: 0.92, transformOrigin: "50% 100%" },
        { scale: 1, duration: 0.9, ease: "power2.out" },
        0.1
      );

      // ---------- Scene 1: "cardápio em vídeo" per-word reveal on the voice ----------
      // VO: "Cardápio" 0.00 · "em" 0.78 · "Vídeo" 1.04
      tl.fromTo(
        q(".f09-cta-w1"),
        { yPercent: 105 },
        { yPercent: 0, duration: 0.55, ease: "power3.out" },
        0.08
      );
      tl.fromTo(
        q(".f09-cta-w2"),
        { yPercent: 105 },
        { yPercent: 0, duration: 0.45, ease: "power3.out" },
        0.78
      );
      tl.fromTo(
        q(".f09-cta-w3"),
        { yPercent: 105 },
        { yPercent: 0, duration: 0.5, ease: "power3.out" },
        1.0
      );

      // ---------- Scene 2 (1.5–2.4s): "por ideal automações" ----------
      // VO: "da" 1.57 · "Ideal" 1.68 · "Automações" 1.92
      var byTimes = [1.55, 1.68, 1.9];
      qa(".f09-cta-by-word").forEach(function (w, i) {
        tl.fromTo(
          w,
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
          byTimes[i]
        );
      });

      // ---------- Scene 3 (2.4–4.0s): CTA button-build ----------
      // VO: "Chama" 2.38 · "gente" 2.90 · "WhatsApp" 3.42
      tl.fromTo(
        ".f09-cta-pill",
        { y: 90, scale: 0.86, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" },
        2.36
      );
      var rect = q(".f09-cta-pill-rect");
      var rlen = 2 * (760 - 136) + Math.PI * 136;
      try {
        rlen = rect.getTotalLength() * 1.02;
      } catch (e) {}
      rect.style.strokeDasharray = String(rlen);
      rect.style.strokeDashoffset = String(rlen);
      tl.fromTo(
        rect,
        { strokeDashoffset: rlen },
        { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" },
        2.5
      );
      tl.fromTo(
        ".f09-cta-pill-text",
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        2.58
      );
      // orange floods the pill once the border closes; label flips to ink-on-fire
      tl.fromTo(
        ".f09-cta-pill-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.inOut" },
        3.05
      );
      tl.fromTo(
        ".f09-cta-pill-label",
        { color: "#fff4ea" },
        { color: "#0f0805", duration: 0.3, ease: "power1.out" },
        3.2
      );
      tl.fromTo(
        ".f09-cta-glow",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" },
        3.1
      );
      // arrow lands on "WhatsApp"
      tl.fromTo(
        ".f09-cta-arrow",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.4
      );

      // ---------- Scene 4 (4.0–6.2s): hold, near-imperceptible push, final fade ----------
      tl.fromTo(
        ".f09-cta-lockup",
        { scale: 1 },
        { scale: 1.025, duration: 2.4, ease: "none" },
        3.4
      );
      tl.to(".f09-cta-glow", { opacity: 0.8, duration: 1.6, ease: "sine.inOut" }, 4.1);
      // final frame of the video: fade to the dark ground over the last 0.4s
      tl.fromTo(
        ".f09-cta-fadeout",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.in" },
        DUR - 0.4
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
