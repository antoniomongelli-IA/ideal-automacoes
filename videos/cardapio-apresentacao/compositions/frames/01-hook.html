      var root = document.querySelector('[data-composition-id="01-hook"]');

        return root.querySelector('[id="01-hook-' + id + '"]');
      }

      var bg = q("glow"), dim = q("dim"), cam = q("cam");
      var sheetJit = q("sheet-jit"), sheet = q("sheet");
      var cardJit = q("card-jit"), card = q("card"), spin = q("spin"), barFill = q("bar-fill");

      gsap.set(strike, { strokeDasharray: 1, strokeDashoffset: 1 });

      var tl = gsap.timeline({ paused: true });

      tl.fromTo(bg, { opacity: 0.55 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

      // ---- Scene 1 (0.0–1.1): "cardápio de papel?" flash-in, menu sheet falls in depth ----
      tl.fromTo(l1, { opacity: 0, scale: 1.16 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.out" }, 0);

      tl.fromTo(
        sheet,
        { z: 1150, y: -220, rotationX: 64, rotationZ: -46, opacity: 0.95 },
        { z: 0, y: 0, rotationX: 14, rotationZ: -9, opacity: 0.34, duration: 0.88, ease: "power2.in" },
        0.04
      );
      // landing settle on the back plane
      tl.fromTo(sheet, { rotationX: 14 }, { rotationX: 9, duration: 0.22, ease: "back.out(2)" }, 0.92);

      // ---- Scene 2 (1.1–2.4): scale-swap; PDF card drops onto the sheet; strike on "ninguém" ----

      tl.to(l1, { scale: 0.44, y: -430, opacity: 0.5, duration: 0.4, ease: "power3.inOut" }, 1.118);

      // PDF card falls from the top and hits on "PDF"

        card,
        { y: -1500, z: 320, rotationZ: 20, rotationX: -24 },
        { y: 0, z: 0, rotationZ: -4, rotationX: 6, duration: 0.56, ease: "power3.in" },
        1.13
      );
      tl.fromTo(card, { scaleY: 0.93, scaleX: 1.03 }, { scaleY: 1, scaleX: 1, duration: 0.24, ease: "back.out(3)" }, 1.69);
      // impact knocks the sheet
      tl.fromTo(sheetJit, { y: 14, rotationZ: 1.2 }, { y: 0, rotationZ: 0, duration: 0.3, ease: "power2.out" }, 1.69);

      // spinner + stuck progress — loads forever

      tl.fromTo(barFill, { scaleX: 0.6 }, { scaleX: 1, duration: 1.2, ease: "power2.out", transformOrigin: "0% 50%" }, 1.7);

      // incoming phrase pops in chunk by chunk on the voice

      tl.fromTo(w2, { opacity: 0, scale: 0.45 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 2.02);
      tl.fromTo(strike, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.32, ease: "power1.inOut" }, 2.13);
      tl.fromTo(w3, { opacity: 0, scale: 0.45 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 2.42);

      // ---- Scene 3 (2.4–3.3): hold; papers jitter; ground darkens ----
      var jit = [1.1, -0.8, 0.9, -1.2, 0.6, -0.5, 0.3];
      var jx = [3, -2, 2, -3, 1, -1, 0];
      for (var i = 0; i < jit.length; i++) {
        var t = 2.5 + i * 0.11;
        tl.to(sheetJit, { rotationZ: jit[i] * 0.7, x: jx[i], duration: 0.11, ease: "sine.inOut" }, t);
        tl.to(cardJit, { rotationZ: -jit[i], x: -jx[i], duration: 0.11, ease: "sine.inOut" }, t);
